# Контент-Завод: PostgreSQL, Redis, приложение и NocoDB (админка поверх БД).
# Запуск: docker compose up -d (на VPS или локально).
# В .env задайте: POSTGRES_PASSWORD, REDIS_URL, NC_AUTH_JWT_SECRET.
# DATABASE_URL и NC_DB собираются из POSTGRES_* — пароль не расходится (ошибка 28P01).
#
# HTTPS для API онбординга (Let's Encrypt): в .env задайте CADDY_DOMAIN (напр. bot.ex-ai.pro, DNS A → IP VPS),
# затем: docker compose --profile https up -d
# Откройте 80/tcp и 443/tcp на фаерволе. Пример URL: https://bot.ex-ai.pro/api/onboarding
# Рекомендация: закрыть прямой доступ к 3100 с интернета — в ports у app заменить на "127.0.0.1:3100:3100".
#
# NocoDB (на VPS): после старта откройте http://<IP-или-домен-сервера>:8080
# (контейнер слушает 0.0.0.0:8080). Создайте первый аккаунт в UI — это админ NocoDB.
# После входа добавьте источник данных: Add Base → PostgreSQL → хост postgres, порт 5432, user, пароль из .env, БД content_factory — появятся таблицы (clients, cost_records, tasks и др.).
# Рекомендуется: закрыть 8080 файрволом для всех кроме своего IP или проксировать с HTTPS.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: content_factory
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    build: .
    depends_on:
      - postgres
      - redis
    # Весь .env подхватывается; для онбординга копии таблицы задайте все три GOOGLE_DRIVE_COPY_OAUTH_* иначе copy от SA → storageQuotaExceeded
    env_file: .env
    environment:
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:-password}@postgres:5432/content_factory
      REDIS_URL: redis://redis:6379
    volumes:
      - ./secrets:/app/secrets:ro
      - ./logs:/app/logs
    ports:
      - "3100:3100"
    restart: unless-stopped

  nocodb:
    image: nocodb/nocodb:latest
    restart: unless-stopped
    depends_on:
      - postgres
    env_file: .env
    environment:
      # Единый пароль из POSTGRES_PASSWORD — избегаем 28P01 (password authentication failed)
      NC_DB: "pg://postgres:5432?u=user&p=${POSTGRES_PASSWORD:-password}&d=content_factory"
      NC_AUTH_JWT_SECRET: "${NC_AUTH_JWT_SECRET:-change-me-in-production}"
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "8080:8080"

  # Опционально: автоматический TLS (Caddy + Let's Encrypt). Профиль https — не мешает обычному up -d.
  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  nocodb_data:
  caddy_data:
  caddy_config:
